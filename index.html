<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amer · آمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F6;
    --paper-2:#F1EFE8;
    --card:#FFFFFF;
    --ink:#1A1A18;
    --ink-solid:#1A1A18;
    --ink-soft:#5B5955;
    --ink-faint:#8A8884;
    --red:#E31E24;
    --red-deep:#A81419;
    --red-tint:#FCE9E9;
    --green:#2FA84F;
    --green-deep:#0B6E4F;
    --green-tint:#E8F5EC;
    --gold:#A9822C;
    --gold-tint:#F6EFDD;
    --line:rgba(26,26,24,.10);
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(26,26,24,.05), 0 10px 28px -14px rgba(26,26,24,.22);
    --sidebar-bg:#15130F;
    --sidebar-text:#EEEDE9;
    --sidebar-text-soft:#9C9A93;
    --sidebar-active:rgba(255,255,255,.07);
    --font-ar-display:'Cairo','IBM Plex Sans Arabic',sans-serif;
    --font-ar-body:'IBM Plex Sans Arabic','Cairo',sans-serif;
    --font-en-display:'Inter',sans-serif;
    --font-en-body:'Inter',sans-serif;
    --f-display:var(--font-ar-display);
    --f-body:var(--font-ar-body);
  }
  html.lang-en{ --f-display:var(--font-en-display); --f-body:var(--font-en-body); }
  html.dark-mode{
    --paper:#141310;
    --paper-2:#1D1B15;
    --card:#221F19;
    --ink:#F3F1EA;
    --ink-soft:#B7B4AB;
    --ink-faint:#87847C;
    --red-tint:rgba(227,30,36,.16);
    --green-tint:rgba(47,168,79,.16);
    --gold-tint:rgba(169,130,44,.18);
    --line:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.65);
  }
  html.dark-mode .auth-error, html.dark-mode .alert-banner{ color:#F0797D; }
  html.dark-mode .badge-paid{ color:#5CC97F; }
  html.dark-mode .badge-unpaid, html.dark-mode .badge-rank, html.dark-mode .viewing-banner{ color:#D8B24E; }
  html.dark-mode .badge-overdue, html.dark-mode .badge-error{ color:#F0797D; }
  html.dark-mode .field input:focus, html.dark-mode .filter-bar input:focus, html.dark-mode .qty-stepper button:hover{ background:var(--card); }
  html.dark-mode .modal-box{ background:var(--card); }
  html.dark-mode .auth-watermark{ opacity:.08; }
  html.dark-mode .lifetime-card:hover{ background:#2B271F; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
  body{overflow-x:hidden;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
  @keyframes viewFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .view-fade{animation:viewFadeIn .32s cubic-bezier(.2,.8,.2,1);}
  body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh;}
  h1,h2,h3,.display{font-family:var(--f-display);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14.5px;}
  :focus-visible{outline:2.5px solid var(--green-deep);outline-offset:2px;}
  a{color:var(--green-deep);}
  .hidden{display:none !important;}
  p{margin:0;}

  /* ---------- shared ribbon gradient ---------- */
  /* defined via inline <defs> svg */

  /* ---------- Auth ---------- */
  .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;position:relative;overflow:hidden;}
  .auth-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.05;pointer-events:none;}
  .auth-watermark svg{width:340px;height:auto;}
  .auth-card{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:400px;padding:34px 30px 28px;overflow:hidden;}
  .auth-card::before{content:"";position:absolute;top:0;inset-inline:0;height:4px;background:linear-gradient(90deg,var(--red),var(--green-deep) 55%,var(--green));}
  .auth-lang-toggle{position:absolute;top:18px;inset-inline-end:18px;z-index:2;display:flex;gap:8px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.3px;display:inline-block;transform-origin:bottom center;animation:brandSway 3.4s ease-in-out infinite;}
  @keyframes brandSway{ 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(7deg);} 75%{transform:rotate(-7deg);} }
  .brand-text span{font-size:11px;color:var(--ink-soft);font-weight:500;}
  .auth-card .brand{justify-content:center;margin-bottom:20px;}
  .auth-card h1{font-size:19px;font-weight:700;text-align:center;margin:0 0 4px;}
  .auth-card p.sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);color:var(--ink);transition:border-color .15s;}
  .field input:focus,.field select:focus{border-color:var(--green-deep);background:var(--card);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-weight:700;font-size:14px;transition:transform .1s,opacity .15s;white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink-solid);color:#fff;width:100%;padding:12px;font-size:14.5px;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-success{background:var(--green-deep);color:#fff;}
  .btn-success:hover{opacity:.9;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-danger:hover{opacity:.9;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-pill{border-radius:20px;padding:6px 14px;font-size:12.5px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft);}
  .auth-switch{text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink-soft);}
  .auth-error{background:var(--red-tint);color:var(--red-deep);border:1px solid rgba(227,30,36,.25);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .auth-reset{display:block;text-align:center;margin-top:22px;font-size:12px;color:var(--ink-faint);text-decoration:underline;background:none;border:none;width:100%;}
  .form-note{font-size:12px;color:var(--ink-faint);margin-top:-6px;margin-bottom:14px;}

  /* ---------- App shell (sidebar + content) ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .news-ticker{position:relative;overflow:hidden;background:var(--ink-solid);height:36px;}
  .news-ticker .nt-inner{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;color:#fff;font-size:13px;font-weight:600;left:-100%;animation-name:tickerLTR;animation-timing-function:linear;animation-iteration-count:infinite;}
  .news-ticker .nt-inner b{color:var(--gold);margin-inline-end:8px;}
  @keyframes tickerLTR{ from{left:-100%;} to{left:100%;} }
  .sidebar{
    width:250px;flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-text);
    display:flex;flex-direction:column;padding:20px 14px;
  }
  .sidebar .brand{padding:4px 8px 22px;}
  .sidebar .brand-text b{color:#fff;}
  .sidebar .brand-text span{color:var(--sidebar-text-soft);}
  .nav-group-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sidebar-text-soft);padding:14px 10px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;color:var(--sidebar-text-soft);
    font-size:13.5px;font-weight:600;background:none;border:none;width:100%;text-align:start;
    border-inline-start:3px solid transparent;transition:background .15s ease,color .15s ease;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--sidebar-active);color:var(--sidebar-text);}
  .nav-item.active{background:var(--sidebar-active);color:#fff;border-inline-start:3px solid;border-image:linear-gradient(var(--red),var(--green));border-image-slice:1;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar-user{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px;}
  .sidebar-user .who{font-size:13px;color:#fff;font-weight:700;}
  .sidebar-user .role{font-size:11px;color:var(--sidebar-text-soft);}
  .sidebar-icon-btn{background:rgba(255,255,255,.06);border:none;color:var(--sidebar-text-soft);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .sidebar-icon-btn:hover{color:#fff;background:rgba(255,255,255,.12);}
  .sidebar-icon-row{display:flex;gap:6px;}
  .lang-pill-row{display:flex;gap:6px;margin-top:12px;}
  .lang-pill{flex:1;padding:6px 0;text-align:center;border-radius:8px;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);color:var(--sidebar-text-soft);border:1px solid transparent;}
  .lang-pill.active{background:#fff;color:var(--ink-solid);}

  .content{flex:1;min-width:0;padding:26px 30px 60px;position:relative;}
  .content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .content-header h1{font-size:21px;margin:0;}
  .content-header .sub{font-size:13px;color:var(--ink-soft);margin-top:3px;}

  .alert-banner{display:flex;align-items:center;gap:10px;background:var(--red-tint);color:var(--red-deep);border:1px solid rgba(227,30,36,.25);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;font-size:13.5px;font-weight:600;}
  .alert-banner svg{width:20px;height:20px;flex-shrink:0;}
  .alert-banner .grow{flex:1;}

  /* ---------- Dashboard hero ---------- */
  .hero-row{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-bottom:20px;}
  .goal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:box-shadow .2s ease,transform .2s ease;}
  .goal-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(26,26,24,.06),0 16px 32px -14px rgba(26,26,24,.28);}
  .goal-ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);}
  .goal-card .g-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;}
  .goal-ring{position:relative;width:150px;height:150px;}
  .goal-ring svg{transform:rotate(-90deg);}
  .goal-ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .goal-ring .center .num{font-family:var(--f-display);font-weight:800;font-size:26px;}
  .goal-ring .center .den{font-size:11.5px;color:var(--ink-faint);}
  .goal-card .g-foot{font-size:12px;color:var(--ink-faint);margin-top:10px;}

  .stat-stack{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-inline-start:4px solid var(--ink);transition:box-shadow .2s ease,transform .2s ease;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(26,26,24,.06),0 16px 32px -14px rgba(26,26,24,.28);}
  .stat-card.acc-gold{border-inline-start-color:var(--gold);}
  .stat-card.acc-green{border-inline-start-color:var(--green-deep);}
  .stat-card.acc-red{border-inline-start-color:var(--red);}
  .stat-card .label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .stat-card .value{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;}
  .stat-card .value small{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .stat-card .foot{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}

  .lifetime-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px;}
  .lifetime-card{background:var(--paper-2);border-radius:var(--radius-sm);padding:14px;text-align:center;transition:transform .2s ease,background .2s ease;}
  .lifetime-card:hover{transform:translateY(-2px);background:#EDEBE2;}
  .lifetime-card .n{font-family:var(--f-display);font-weight:800;font-size:20px;}
  .lifetime-card .l{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .quick-actions{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;}
  .quick-btn{display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--radius-sm);border:1.5px dashed var(--line);background:var(--card);font-weight:700;font-size:13.5px;color:var(--ink);transition:transform .15s ease,border-color .15s ease,background .15s ease;}
  .quick-btn:hover{border-color:var(--green-deep);background:var(--green-tint);transform:translateY(-2px);}
  .quick-btn.qa-red:hover{border-color:var(--red);background:var(--red-tint);}
  .quick-btn svg{width:18px;height:18px;}

  /* ---------- Panels / cards ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px;}
  .panel-title{font-size:16px;font-weight:700;margin:0 0 4px;}
  .panel-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .tally-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .tally-btn{flex:1;min-width:200px;background:var(--paper-2);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;transition:border-color .2s ease;}
  .tally-btn:hover{border-color:var(--line);}
  .tally-btn .t-count{font-family:var(--f-display);font-weight:800;font-size:28px;}
  .tally-btn .t-label{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .tally-btn .t-add{align-self:stretch;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:start;background:var(--paper-2);color:var(--ink-soft);font-weight:700;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:rgba(26,26,24,.02);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .filter-bar{position:relative;max-width:340px;margin-bottom:16px;}
  .filter-bar svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:12px;width:16px;height:16px;color:var(--ink-faint);pointer-events:none;}
  .filter-bar input{width:100%;padding:9px 12px;padding-inline-start:36px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);font-size:13.5px;color:var(--ink);transition:border-color .15s,background .15s;}
  .filter-bar input:focus{border-color:var(--green-deep);background:var(--card);}
  .qty-stepper{display:flex;align-items:center;gap:8px;}
  .qty-stepper input{width:100%;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);}
  .qty-stepper button{width:36px;height:36px;flex-shrink:0;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-weight:800;font-size:16px;}
  .qty-stepper button:hover{background:var(--card);border-color:var(--green-deep);color:var(--green-deep);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge-paid{background:var(--green-tint);color:var(--green-deep);}
  .badge-unpaid{background:var(--gold-tint);color:var(--gold);}
  .badge-overdue{background:var(--red-tint);color:var(--red-deep);}
  .badge-error{background:var(--red-tint);color:var(--red-deep);}
  .badge-admin{background:var(--ink-solid);color:#fff;}
  .badge-rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;background:var(--gold-tint);color:var(--gold);margin-inline-end:6px;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--ink-faint);font-size:13.5px;}

  .report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .report-stat{background:var(--paper-2);border-radius:var(--radius-sm);padding:14px;text-align:center;}
  .report-stat .n{font-family:var(--f-display);font-weight:800;font-size:21px;}
  .report-stat .l{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .cust-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:18px;align-items:end;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(26,26,24,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:var(--card);border-radius:var(--radius);padding:22px;width:100%;max-width:380px;box-shadow:var(--shadow);}
  .modal-box h3{margin:0 0 14px;font-size:16px;}

  .viewing-banner{display:flex;align-items:center;justify-content:space-between;background:var(--gold-tint);color:var(--gold);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;font-size:13px;font-weight:700;}
  .news-item-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .news-item-row .news-item-text{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);color:var(--ink);font-size:14px;}
  .news-item-row .news-item-text:focus{border-color:var(--green-deep);background:var(--card);}
  .checkbox-row{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .checkbox-row input{width:16px;height:16px;}
  .news-item-row .checkbox-row{white-space:nowrap;}

  @media (max-width:900px){
    #app-shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:10px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;}
    .sidebar .brand{padding:0;margin-inline-end:10px;flex-shrink:0;}
    .nav-group-label{display:none;}
    .sidebar nav{display:flex;gap:4px;}
    .nav-item{flex-direction:column;font-size:10.5px;padding:8px 10px;min-width:56px;white-space:nowrap;border-inline-start:none;border-bottom:3px solid transparent;}
    .nav-item.active{border-image:none;border-bottom:3px solid var(--green-deep);}
    .sidebar-footer{margin-top:0;margin-inline-start:auto;border-top:none;padding-top:0;display:flex;align-items:center;flex-shrink:0;}
    .lang-pill-row{display:none;}
    .content{padding:20px 16px 60px;}
    .hero-row{grid-template-columns:1fr;}
    .lifetime-row{grid-template-columns:repeat(2,1fr);}
    .report-grid{grid-template-columns:repeat(2,1fr);}
    .stat-stack{grid-template-columns:1fr;}
  }

  /* ---------- Phones ---------- */
  @media (max-width:600px){
    input,select,textarea{font-size:16px;} /* prevents iOS auto-zoom on focus */
    .auth-shell{padding:20px 14px;}
    .auth-card{padding:26px 18px 22px;max-width:100%;}
    .auth-lang-toggle{top:12px;inset-inline-end:12px;}
    .content{padding:16px 12px 50px;}
    .content-header h1{font-size:18px;}
    .panel{padding:16px;}
    .goal-ring{width:130px;height:130px;}
    .goal-ring svg{width:130px;height:130px;}
    .lifetime-row{grid-template-columns:repeat(2,1fr);gap:10px;}
    .report-grid{grid-template-columns:1fr 1fr;gap:10px;}
    .tally-row{flex-direction:column;}
    .tally-btn{min-width:0;}
    .cust-form{grid-template-columns:1fr !important;}
    .cust-form button{width:100% !important;}
    .filter-bar{max-width:100%;}
    .modal-box{padding:18px;max-width:100%;}
    .row-actions{gap:5px;}
    .row-actions .btn-sm{flex:1;min-width:80px;}
    table{font-size:12.5px;}
    thead th, tbody td{padding:8px 8px;}
    .news-ticker .nt-inner{font-size:12px;}
  }

  @media (max-width:380px){
    .content{padding:14px 10px 44px;}
    .panel{padding:12px;}
    .auth-card{padding:22px 14px 18px;}

  async function sGet(key, shared){
    if(HAS_STORAGE){
      try{ const r = await window.storage.get(key, shared); return (r && r.value!=null) ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    const k = shared+"::"+key;
    return memoryStore.has(k) ? JSON.parse(memoryStore.get(k)) : null;
  }
  async function sSet(key, value, shared){
    const str = JSON.stringify(value);
    if(HAS_STORAGE){
      try{ await window.storage.set(key, str, shared); return true; }
      catch(e){ console.error("storage save failed", e); return false; }
    }
    memoryStore.set(shared+"::"+key, str); return true;

  function iconSvg(key, sw){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.9}" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]}</svg>`; }

  /* ================= language / direction ================= */
  function applyLangDir(){
    const html = document.getElementById("html-root");
    html.setAttribute("lang", lang);
    html.setAttribute("dir", lang==="ar" ? "rtl" : "ltr");
    html.classList.toggle("lang-en", lang==="en");
    document.getElementById("auth-lang-btn").textContent = lang==="ar" ? "EN" : "AR";
    const pillAr = document.getElementById("pill-ar"), pillEn = document.getElementById("pill-en");
    if(pillAr){ pillAr.classList.toggle("active", lang==="ar"); pillEn.classList.toggle("active", lang==="en"); }
  }
  function setLang(l){
    lang = l; applyLangDir();
    sSet(LANG_KEY, { lang }, false);
    if(document.getElementById("app-shell").classList.contains("hidden")){
      paintAuthText();
    } else {
      renderShell(); renderView();
    }
  }
  function paintAuthText(){
    document.getElementById("setup-brand-b").textContent = t("brand");
    document.getElementById("setup-brand-s").textContent = t("tagline");
    document.getElementById("setup-title").textContent = t("setupTitle");
    document.getElementById("setup-sub").textContent = t("setupSub");
    document.getElementById("l-setup-name").textContent = t("fullName");
    document.getElementById("l-setup-user").textContent = t("username");
    document.getElementById("l-setup-pass").textContent = t("password");
    document.getElementById("btn-setup-submit").textContent = t("createAdmin");

    document.getElementById("login-title").textContent = t("loginTitle");
    document.getElementById("login-sub").textContent = t("loginSub");
    document.getElementById("l-login-user").textContent = t("username");
    document.getElementById("l-login-pass").textContent = t("password");

  /* ================= theme (light/dark) ================= */
  function applyTheme(){
    document.getElementById("html-root").classList.toggle("dark-mode", theme==="dark");
    const icon = theme==="dark" ? iconSvg("sun",2) : iconSvg("moon",2);
    const title = theme==="dark" ? t("themeLight") : t("themeDark");
    const btnMain = document.getElementById("btn-theme");
    const btnAuth = document.getElementById("btn-theme-auth");
    if(btnMain){ btnMain.innerHTML = icon; btnMain.title = title; }
    if(btnAuth){ btnAuth.innerHTML = icon; btnAuth.title = title; }
  }
  function setTheme(newTheme){
    theme = newTheme;
    applyTheme();
    sSet(THEME_KEY, { theme }, false);
  }
  function toggleTheme(){ setTheme(theme==="dark" ? "light" : "dark"); }

  /* ================= news ticker ================= */
  function normalizeNews(raw){
    if(!raw) return { items: [] };
    if(Array.isArray(raw.items)) return { items: raw.items.filter(it=>it && typeof it.text==="string") };
    if(typeof raw.text === "string" && raw.text.trim()) return { items: [{ id: uid(), text: raw.text.trim(), active: true }] };
    return { items: [] };
  }
  function newsItemRowHtml(item){
    return `<div class="news-item-row" data-newsid="${esc(item.id)}">
      <input type="text" class="news-item-text" value="${escAttr(item.text||"")}" placeholder="${t("newsTickerPlaceholder")}">
      <label class="checkbox-row"><input type="checkbox" class="news-item-active" ${item.active!==false?"checked":""}> ${t("newsItemActive")}</label>
      <button class="btn btn-danger btn-sm news-item-del" type="button">${t("delete")}</button>
    </div>`;
  }
  function wireNewsItemRow(rowEl){
    rowEl.querySelector(".news-item-del").addEventListener("click", ()=> rowEl.remove());
  }
  function renderNewsTicker(){
    const bar = document.getElementById("news-ticker");
    const textEl = document.getElementById("news-ticker-text");
    const inner = document.getElementById("news-ticker-inner");
    const items = (newsTicker && Array.isArray(newsTicker.items)) ? newsTicker.items.filter(it=> it.active && it.text && it.text.trim()) : [];
    if(items.length===0){ bar.classList.add("hidden"); return; }
    bar.classList.remove("hidden");
    const combined = items.map(it=> it.text.trim()).join("     •     ");
    textEl.textContent = combined;
    // Base pace kept from the original design, then slowed down by 60% (duration × 2.5).
    const duration = Math.max(30, Math.min(130, combined.length * 0.7));
    inner.style.animationDuration = duration + "s";
  }

  /* ================= sidebar / shell ================= */
  function navItems(){
    const items = [
      {id:"dashboard", icon:"grid", label:t("navDashboard")},
      {id:"tally", icon:"plusCircle", label:t("navTally")},
      {id:"unpaid", icon:"hourglass", label:t("navUnpaid")},
      {id:"errors", icon:"alertTriangle", label:t("navErrors")},
      {id:"customers", icon:"users", label:t("navCustomers")}
    ];
    if(currentUser.role === "admin") items.push({id:"team", icon:"layers", label:t("navTeam")});
    items.push({id:"reports", icon:"barChart", label:t("navReports")});
    items.push({id:"settings", icon:"gear", label:t("navSettings")});
    return items;
  }
  function renderShell(){
    document.getElementById("sidebar-tagline").textContent = t("tagline");
    document.getElementById("side-user-name").textContent = currentUser.displayName || currentUser.username;
    document.getElementById("side-user-role").textContent = currentUser.role === "admin" ? t("admin") : t("agent");
    document.getElementById("btn-change-pw").title = t("changePassword");
    document.getElementById("btn-logout").title = t("logout");

    const nav = document.getElementById("side-nav");
    nav.innerHTML = navItems().map(it => `
      <button class="nav-item ${activeView===it.id?"active":""}" data-view="${it.id}">
        ${iconSvg(it.icon,1.8)}<span>${it.label}</span>
      </button>`).join("");
    nav.querySelectorAll(".nav-item").forEach(b=>{
      b.addEventListener("click", ()=>{
        activeView = b.getAttribute("data-view");
        if(activeView !== "reports") reportContext = null;
        renderShell(); renderView();
      });
    });

  /* ================= views ================= */
  function contentHeader(title, sub){
    return `<div class="content-header"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div></div>`;
  }

  function dueBannerHtml(data){
    const due = overdueUnpaid(data);
    if(due.length===0) return "";
    return `<div class="alert-banner">${iconSvg("alertTriangle",1.8)}<span class="grow">${due.length} ${t("needsFollowup")}</span></div>`;
  }

  function renderDashboard(){
    const key = currentMonthKey();
    const s = salaryFor(agentData, key);
    const pct = Math.max(0, Math.min(100, Math.round((s.completed/settings.threshold)*100)));
    const R = 54, C = 2*Math.PI*R;
    const offset = C - (pct/100)*C;
    const due = overdueUnpaid(agentData);
    const lt = lifetimeStats(agentData);

    const thirdCard = due.length>0
      ? `<div class="stat-card acc-red"><div class="label">${t("paymentAlert")}</div><div class="value">${due.length}</div><div class="foot">${t("needsFollowup")}</div></div>`
      : `<div class="stat-card acc-green"><div class="label">${t("noOverdue")}</div><div class="value" style="font-size:15px">${t("allUpToDate")}</div></div>`;

    document.getElementById("content-area").innerHTML = `
      ${contentHeader(t("overview"), monthLabel(key))}
      ${dueBannerHtml(agentData)}
      <div class="hero-row">
        <div class="goal-card">
          <div class="g-label">${t("monthlyGoal")}</div>
          <div class="goal-ring">
            <svg width="150" height="150" viewBox="0 0 150 150">
              <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
              <circle cx="75" cy="75" r="${R}" fill="none" stroke="url(#ribbonGrad)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="center"><div class="num">${s.completed}</div><div class="den">${t("ofThreshold")} ${settings.threshold}</div></div>
          </div>
          <div class="g-foot">${ s.completed>=settings.threshold ? `${t("exceededBy")} ${s.extra}` : `${t("remaining")} ${settings.threshold-s.completed} ${t("txToReachGoal")}` }</div>
        </div>
        <div class="stat-stack">
          <div class="stat-card acc-gold" style="grid-column:1/-1">
            <div class="label">${t("totalSalary")}</div>
            <div class="value">${fmt(s.total)} <small>AED</small></div>
            <div class="foot">${t("base")} ${fmt(settings.baseSalary)}${ s.extra>0 ? ` + ${s.extra} ${t("extraTx")} × ${settings.perExtra}` : "" }</div>
          </div>
          <div class="stat-card acc-gold">
            <div class="label">${t("commissionCard")}</div>
            <div class="value">${fmt(s.extra*settings.perExtra)} <small>AED</small></div>
            <div class="foot">${ s.extra>0 ? `${s.extra} × ${fmt(settings.perExtra)} AED` : t("noExtraYet") }</div>
          </div>
          ${thirdCard}
          <div class="stat-card acc-green" style="grid-column:1/-1"><div class="label">${t("navCustomers")}</div><div class="value">${agentData.customers.length}</div></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">${t("lifetimeStats")}</div>
        <div class="lifetime-row">
          <div class="lifetime-card"><div class="n">${fmt(lt.totalTx)}</div><div class="l">${t("lifetimeTx")}</div></div>
          <div class="lifetime-card"><div class="n">${fmt(lt.totalCustomers)}</div><div class="l">${t("lifetimeCustomers")}</div></div>
          <div class="lifetime-card"><div class="n">${fmt(lt.totalPenalties)}</div><div class="l">${t("lifetimePenalties")}</div></div>
          <div class="lifetime-card"><div class="n">${fmt(lt.totalSalary)}</div><div class="l">${t("lifetimeSalary")}</div></div>
        </div>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" id="qa-paid">${iconSvg("plusCircle",2)} ${t("quickAddPaid")}</button>
        <button class="quick-btn qa-red" id="qa-unpaid">${iconSvg("hourglass",2)} ${t("quickAddUnpaid")}</button>
      </div>
    `;
    document.getElementById("qa-paid").addEventListener("click", ()=> openAddTxModal("paid"));
    document.getElementById("qa-unpaid").addEventListener("click", ()=> openAddTxModal("unpaid"));
  }

  function statusBadge(x){
    if(x.status==="paid") return `<span class="badge badge-paid">${t("markPaid")==="Mark as paid"?"Paid":"مدفوعة"}</span>`;
    const overdue = x.dueDate && x.dueDate <= todayStr();
    return overdue ? `<span class="badge badge-overdue">${lang==="ar"?"متأخرة":"Overdue"}</span>`
                   : `<span class="badge badge-unpaid">${lang==="ar"?"غير مدفوعة":"Unpaid"}</span>`;
  }
  function noteCellHtml(x){
    const parts = [];
    if(x.customerName) parts.push(`<b>${esc(x.customerName)}</b>`);
    if(x.note) parts.push(esc(x.note));
    if(x.refNumber) parts.push(`<span style="color:var(--ink-faint);font-size:11.5px;">#${esc(x.refNumber)}</span>`);
    return parts.length ? parts.join(" · ") : "—";
  }
  function rowActions(x){
    const btns = [];
    if(x.status==="unpaid") btns.push(`<button class="btn btn-success btn-sm" data-act="pay" data-id="${x.id}">${t("markPaid")}</button>`);
    btns.push(x.error
      ? `<button class="btn btn-ghost btn-sm" data-act="unflag" data-id="${x.id}">${t("unflagError")}</button>`
      : `<button class="btn btn-ghost btn-sm" data-act="flag" data-id="${x.id}">${t("flagError")}</button>`);
    btns.push(`<button class="btn btn-danger btn-sm" data-act="del" data-id="${x.id}">${t("delete")}</button>`);
    return `<div class="row-actions">${btns.join("")}</div>`;
  }

  function renderTally(){
    const today = todayStr();
    const list = agentData.transactions.filter(x=>x.date===today).sort((a,b)=> b.createdAt-a.createdAt);
    const paidCount = list.filter(x=>x.status==="paid").length;
    const unpaidCount = list.filter(x=>x.status==="unpaid").length;
    const rows = list.map(x => `
      <tr><td>${esc(x.date)}</td><td>${statusBadge(x)} ${x.error?`<span class="badge badge-error">${t("navErrors")}</span>`:""}</td><td>${noteCellHtml(x)}</td><td>${rowActions(x)}</td></tr>
    `).join("");

    document.getElementById("content-area").innerHTML = `
      ${contentHeader(t("navTally"), t("todayTallySub"))}
      <div class="panel">
        <div class="tally-row">
          <div class="tally-btn">
            <span class="t-label">${t("paidToday")}</span>
            <span class="t-count">${paidCount}</span>
            <button class="btn btn-success t-add" id="add-paid">+ ${t("add")}</button>

          <div class="tally-btn">
            <span class="t-label">${t("unpaidToday")}</span>
            <span class="t-count">${unpaidCount}</span>

          <table>
            <thead><tr><th>${t("date")}</th><th>${t("status")}</th><th>${t("note")}</th><th>${t("action")}</th></tr></thead>

    document.getElementById("add-paid").addEventListener("click", ()=> openAddTxModal("paid"));
    document.getElementById("add-unpaid").addEventListener("click", ()=> openAddTxModal("unpaid"));
    wireRowActions();
  }

  let unpaidFilter = "";
  function unpaidRowsFiltered(){
    const q = unpaidFilter.trim().toLowerCase();
    return unpaidAll(agentData).filter(x=>{
      if(!q) return true;
      return (x.note||"").toLowerCase().includes(q) || (x.customerName||"").toLowerCase().includes(q) ||
             (x.refNumber||"").toLowerCase().includes(q) || (x.dueDate||"").includes(q) || (x.date||"").includes(q);

    return unpaidRowsFiltered().map(x => `
      <tr><td>${esc(x.date)}</td><td>${esc(x.dueDate||"—")}</td><td>${statusBadge(x)}</td><td>${noteCellHtml(x)}</td><td>${rowActions(x)}</td></tr>

  let customersFilter = "";
  function customersFilteredList(){
    const q = customersFilter.trim().toLowerCase();
    return customersSorted(agentData).filter(c=>{
      if(!q) return true;
      return (c.name||"").toLowerCase().includes(q) || (c.phone||"").toLowerCase().includes(q);
    });
  }
  function wireCustomerActions(container){
    const root = container || document;
    root.querySelectorAll("[data-cact]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-cid"), act = btn.getAttribute("data-cact");
        const c = agentData.customers.find(x=>x.id===id); if(!c) return;
        if(act==="plus") c.count++;
        else if(act==="minus") c.count = Math.max(0, c.count-1);
        else if(act==="del"){ if(!confirm(t("deleteConfirm"))) return; agentData.customers = agentData.customers.filter(x=>x.id!==id); }
        saveAgentData().then(()=>renderView());
      });
    });
  }
  function customersRowsHtml(){
    const list = customersFilteredList();
    const rankBadge = (i)=> i===0?`<span class="badge-rank">${t("rank1")}</span>`: i===1?`<span class="badge-rank">${t("rank2")}</span>`: i===2?`<span class="badge-rank">${t("rank3")}</span>`:"";
    return list.map((c,i) => `
      <tr>
        <td>${customersFilter? "" : rankBadge(i)}${esc(c.name)}</td>
        <td>${esc(c.phone||"—")}</td>
        <td>${c.count}</td>
        <td>
          <div class="row-actions">
            <button class="btn btn-ghost btn-sm" data-cact="minus" data-cid="${c.id}">-1</button>
            <button class="btn btn-success btn-sm" data-cact="plus" data-cid="${c.id}">+1</button>
            <button class="btn btn-danger btn-sm" data-cact="del" data-cid="${c.id}">${t("delete")}</button>
          </div>
        </td>
      </tr>`).join("");
  }

  function renderReports(){
    const data = reportContext ? reportContext.data : agentData;
    if(!reportMonth) reportMonth = currentMonthKey();
    const key = reportMonth;
    const list = txForMonth(data, key);
    const paidCount = list.filter(x=>x.status==="paid").length;
    const unpaidCount = list.filter(x=>x.status==="unpaid").length;
    const errs = list.filter(x=>x.error);
    const errSum = errs.reduce((a,x)=>a+Number(x.errorAmount||0),0);
    const s = salaryFor(data, key);
    const net = s.total - errSum;
    const top = customersSorted(data).slice(0,5);

    const monthsSet = new Set(data.transactions.map(x=>monthKeyOf(x.date)));
    monthsSet.add(currentMonthKey());
    const months = Array.from(monthsSet).sort().reverse();
    const monthOptions = months.map(m=>`<option value="${m}" ${m===key?"selected":""}>${monthLabel(m)}</option>`).join("");
    const custRows = top.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||"—")}</td><td>${c.count}</td></tr>`).join("");

    document.getElementById("content-area").innerHTML = `
      ${contentHeader(t("reportsPanelTitle"))}
      ${reportContext ? `<div class="viewing-banner"><span>${t("viewingReportFor")} ${esc(reportContext.label)}</span><button class="btn btn-ghost btn-sm" id="back-to-mine">${t("backToMine")}</button></div>` : ""}

            <div class="report-stat"><div class="n">${unpaidCount}</div><div class="l">${t("unpaidTx")}</div></div>
            <div class="report-stat"><div class="n">${errs.length}</div><div class="l">${t("errorTx")}</div></div>

            <div class="report-stat"><div class="n">${fmt(s.total)}</div><div class="l">${t("totalSalaryDue")}</div></div>
            <div class="report-stat"><div class="n">${fmt(net)}</div><div class="l">${t("netIncome")}</div></div>

          <div class="table-wrap">
            <table>
              <thead><tr><th>${t("customerName")}</th><th>${t("customerPhone")}</th><th>${t("txCount")}</th></tr></thead>
              <tbody>${custRows || `<tr><td colspan="3" style="text-align:center;color:var(--ink-faint);">${t("noCustomerData")}</td></tr>`}</tbody>

        </div>

    dashboard: renderDashboard, tally: renderTally, unpaid: renderUnpaid, errors: renderErrors,
    customers: renderCustomers, team: renderTeam, reports: renderReports, settings: renderSettings
  };
  function renderView(){
    VIEW_RENDERERS[activeView]();
    const el = document.getElementById("content-area");
    el.classList.remove("view-fade");
    void el.offsetWidth;
    el.classList.add("view-fade");
  }

  function wireRowActions(container){
    const root = container || document;
    root.querySelectorAll("[data-act]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-id"), act = btn.getAttribute("data-act");
        const x = agentData.transactions.find(v=>v.id===id); if(!x) return;
        if(act==="pay"){ x.status="paid"; x.date = todayStr(); x.dueDate=""; saveAgentData().then(()=>renderView()); }
        else if(act==="del"){ if(!confirm(t("deleteConfirm"))) return; agentData.transactions = agentData.transactions.filter(v=>v.id!==id); saveAgentData().then(()=>renderView()); }
        else if(act==="unflag"){ x.error=false; x.errorAmount=0; saveAgentData().then(()=>renderView()); }
        else if(act==="flag"){ openErrorModal(x); }
      });
    });
  }

  function openAddTxModal(status){
    const root = document.getElementById("modal-root");
    const defaultDue = new Date(Date.now() + 3*86400000).toISOString().slice(0,10);
    const title = status==="paid" ? t("paidToday") : t("unpaidToday");
    root.innerHTML = `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" style="max-width:420px;">
          <h3>${t("addTransactionTitle")} — ${title}</h3>
          <div class="field">
            <label>${t("quantityLabel")}</label>
            <div class="qty-stepper">
              <button type="button" id="qty-minus" aria-label="-">−</button>
              <input id="modal-qty" type="number" min="1" step="1" value="1">
              <button type="button" id="qty-plus" aria-label="+">+</button>
            </div>
          </div>
          ${status==="unpaid" ? `<div class="field"><label>${t("dueDate")}</label><input id="modal-due" type="date" value="${defaultDue}"></div>` : ""}
          <div class="field"><label>${t("refNumberLabel")}</label><input id="modal-ref" type="text"></div>
          <div class="field"><label>${t("note")}</label><input id="modal-note" type="text"></div>
          <div class="field">
            <label>${t("customerLabel")}</label>
            <select id="modal-customer">
              <option value="">${t("noCustomerOption")}</option>
              ${customerOptionsHtml()}
              <option value="__new__">${t("newCustomerOption")}</option>
            </select>
          </div>
          <div class="field hidden" id="field-new-customer">
            <label>${t("newCustomerNamePlaceholder")}</label>
            <input id="modal-new-customer-name" type="text">
            <div style="margin-top:10px;"></div>
            <label>${t("customerPhone")}</label>
            <input id="modal-new-customer-phone" type="tel">
          </div>
          <div class="row-actions" style="justify-content:flex-end;">
            <button class="btn btn-ghost" id="modal-cancel">${t("cancel")}</button>
            <button class="btn btn-primary" style="width:auto;" id="modal-confirm">${t("save")}</button>
          </div>
        </div>
      </div>`;
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", (e)=>{ if(e.target.id==="modal-overlay") closeModal(); });

    const qtyInput = document.getElementById("modal-qty");
    document.getElementById("qty-minus").addEventListener("click", ()=>{ qtyInput.value = Math.max(1, (parseInt(qtyInput.value,10)||1) - 1); });
    document.getElementById("qty-plus").addEventListener("click", ()=>{ qtyInput.value = (parseInt(qtyInput.value,10)||1) + 1; });

    const custSel = document.getElementById("modal-customer");
    const newCustField = document.getElementById("field-new-customer");
    custSel.addEventListener("change", ()=>{ newCustField.classList.toggle("hidden", custSel.value !== "__new__"); });

    document.getElementById("modal-confirm").addEventListener("click", ()=>{
      const qty = Math.max(1, parseInt(qtyInput.value,10) || 1);
      const due = status==="unpaid" ? (document.getElementById("modal-due").value || defaultDue) : "";
      const refNumber = document.getElementById("modal-ref").value.trim();
      const note = document.getElementById("modal-note").value.trim();

      let customerName = "";
      if(custSel.value === "__new__"){
        const newName = document.getElementById("modal-new-customer-name").value.trim();
        const newPhone = document.getElementById("modal-new-customer-phone").value.trim();
        if(!newName || !newPhone){ alert(t("custRequiredForCustomer")); return; }
        customerName = newName;
        const existing = agentData.customers.find(c=> c.name.toLowerCase()===newName.toLowerCase());
        if(existing){ existing.count += qty; if(!existing.phone) existing.phone = newPhone; }
        else agentData.customers.push({ id:uid(), name:newName, phone:newPhone, count:qty, createdAt:Date.now() });
      } else if(custSel.value){
        customerName = custSel.value;
        const existing = agentData.customers.find(c=> c.name===customerName);
        if(existing) existing.count += qty;
      }

      for(let i=0;i<qty;i++){
        agentData.transactions.push({
          id: uid(), date: todayStr(), status, dueDate: due, error:false, errorAmount:0,
          note, refNumber, customerName, createdAt: Date.now() + i
        });
      }
      closeModal();
      saveAgentData().then(()=>renderView());
    });
  }

  async function saveAgentData(){ await sSet(agentKey(currentUser.username), agentData, true); }

  /* ================= auth flow ================= */
  function showSetupCard(){ document.getElementById("card-setup").classList.remove("hidden"); document.getElementById("card-login").classList.add("hidden"); }
  function showLoginCard(){ document.getElementById("card-login").classList.remove("hidden"); document.getElementById("card-setup").classList.add("hidden"); }

  async function enterApp(){
    document.getElementById("view-auth").classList.add("hidden");
    document.getElementById("app-shell").classList.remove("hidden");
    agentData = (await sGet(agentKey(currentUser.username), true)) || { transactions:[], customers:[] };
    newsTicker = normalizeNews(await sGet(NEWS_KEY, true));
    activeView = "dashboard"; reportContext = null;
    applyLangDir();
    renderShell(); renderView();
    renderNewsTicker();
  }
  function exitApp(){
    currentUser = null;
    document.getElementById("app-shell").classList.add("hidden");
    document.getElementById("view-auth").classList.remove("hidden");
    document.getElementById("news-ticker").classList.add("hidden");
    document.getElementById("login-username").value = "";
    document.getElementById("login-password").value = "";
    showLoginCard();
  }

  function wireAuthHandlers(){
    document.getElementById("form-setup").addEventListener("submit", (e)=>{
      e.preventDefault();
      const displayName = document.getElementById("setup-name").value.trim();
      const username = document.getElementById("setup-username").value.trim();
      const password = document.getElementById("setup-password").value;
      const errBox = document.getElementById("setup-error");
      if(!displayName || !username || !password){ errBox.textContent = t("fillAll"); errBox.classList.remove("hidden"); return; }
      errBox.classList.add("hidden");
      const admin = { username, password, displayName, role:"admin", createdAt:Date.now() };
      users = [admin];
      currentUser = admin;
      Promise.all([saveUsers(), saveSettings()]).then(enterApp);
    });

    document.getElementById("form-login").addEventListener("submit", (e)=>{
      e.preventDefault();
      const u = document.getElementById("login-username").value.trim();
      const p = document.getElementById("login-password").value;
      const errBox = document.getElementById("login-error");
      const found = users.find(x=>x.username===u && x.password===p);
      if(found){ errBox.classList.add("hidden"); currentUser = found; enterApp(); }
      else { errBox.textContent = t("loginError"); errBox.classList.remove("hidden"); }
    });

    document.getElementById("btn-reset-data").addEventListener("click", ()=>{
      if(confirm(t("resetConfirm"))){
        users = []; settings = { ...DEFAULT_SETTINGS };
        Promise.all([saveUsers(), saveSettings()]).then(()=> showSetupCard());
      }
    });

    document.getElementById("auth-lang-btn").addEventListener("click", ()=> setLang(lang==="ar"?"en":"ar"));
    document.getElementById("pill-ar").addEventListener("click", ()=> setLang("ar"));
    document.getElementById("pill-en").addEventListener("click", ()=> setLang("en"));
    document.getElementById("btn-logout").addEventListener("click", exitApp);
    document.getElementById("btn-change-pw").addEventListener("click", openChangePasswordModal);
    document.getElementById("btn-theme").addEventListener("click", toggleTheme);
    document.getElementById("btn-theme-auth").addEventListener("click", toggleTheme);
  }

  /* ================= init ================= */
  async function init(){
    const langPref = await sGet(LANG_KEY, false);
    lang = (langPref && langPref.lang) || "ar";
    applyLangDir();
    const themePref = await sGet(THEME_KEY, false);
    theme = (themePref && themePref.theme) || "light";
    applyTheme();
    users = (await sGet(USERS_KEY, true)) || [];
    settings = (await sGet(SETTINGS_KEY, true)) || { ...DEFAULT_SETTINGS };
    wireAuthHandlers();
    paintAuthText();
    if(users.length === 0){ showSetupCard(); } else { showLoginCard(); }
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
